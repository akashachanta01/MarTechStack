<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>MarTechJobs</title>
</head>
<body style="margin:0; padding:0; background-color:#f5efe6; -webkit-font-smoothing:antialiased; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <!-- Preheader: shows as preview text in the inbox, helps avoid spam -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{% block preheader %}The job board built only for Marketing Operations & MarTech engineers.{% endblock %}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5efe6;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #ece3d6;">

          <!-- Header -->
          <tr>
            <td style="background:#0e1c30; padding:28px 32px; text-align:center;">
              <a href="{{ domain|default:'https://martechjobs.io' }}" style="text-decoration:none; font-family:Georgia,'Times New Roman',serif; font-size:26px; font-weight:700; color:#ffffff; letter-spacing:-0.5px;">
                MarTech<span style="color:#e8965f;">Jobs</span>
              </a>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 36px 32px 36px; color:#2b2b2b; font-size:16px; line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#faf6f0; padding:28px 32px; text-align:center; border-top:1px solid #ece3d6;">
              <p style="margin:0 0 6px 0; font-size:13px; color:#7a7165; line-height:1.5;">
                You're receiving this because you subscribed to job alerts at
                <a href="{{ domain|default:'https://martechjobs.io' }}" style="color:#bf5420; text-decoration:none;">martechjobs.io</a>.
              </p>
              <p style="margin:0; font-size:13px; color:#9a9183;">
                <a href="{{ unsubscribe_url|default:'https://martechjobs.io/unsubscribe/' }}" style="color:#9a9183; text-decoration:underline;">Unsubscribe</a>
                &nbsp;·&nbsp; MarTechJobs · The MarTech-only job board
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
