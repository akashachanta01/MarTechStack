{# Shared styles + currency switch for course pages: rupees in India, US dollars elsewhere. #}
<style>
  .cx-wrap{max-width:1180px;margin:0 auto;padding:0 32px}
  @media (max-width:640px){.cx-wrap{padding:0 16px}}
  .cx-tile{display:flex;align-items:flex-end;padding:16px;min-height:120px;border-radius:12px;color:#fff;font-weight:800;font-size:15px;line-height:1.3;position:relative;overflow:hidden}
  .cx-tile:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
  .cx-tile.navy{background:linear-gradient(135deg,#1e2a3a,#33507a)}
  .cx-tile.amber{background:linear-gradient(135deg,#b4532a,#e08a3c)}
  .cx-tile.violet{background:linear-gradient(135deg,#4b2a7a,#7a4fc2)}
  .cx-tile.green{background:linear-gradient(135deg,#0f5a44,#22906b)}
  .cx-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#fdf0c4;color:#6b4a00}
  .cx-meta{font-size:13px;color:var(--ink3)}
  .cx-price{font-size:22px;font-weight:800;color:var(--ink)}
  .cx-price s{font-size:14px;font-weight:600;color:var(--ink3);margin-left:6px}
  .cx-save{font-size:13px;font-weight:700;color:#12805c}
  .cx-member{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.45}
  .cx-member a{font-weight:700;color:var(--amber)}
  .cx-btn{display:block;width:100%;text-align:center;background:var(--amber);color:#fff;font-weight:800;border:0;border-radius:10px;padding:14px 16px;font-size:16px;text-decoration:none;cursor:pointer;box-sizing:border-box}
  .cx-btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .cx-form{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:22px}
  .cx-form label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 6px}
  .cx-form input[type=text],.cx-form input[type=email]{width:100%;padding:12px;border:1px solid var(--rule);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;box-sizing:border-box}
  .cx-form ul{list-style:none;padding:0;margin:0}
  .cx-form ul li label{display:flex;align-items:center;gap:8px;font-weight:500;margin:6px 0}
  .cx-form ul li input{width:18px;height:18px}
  .cx-form .errorlist{color:#b42318;font-size:13px;margin:4px 0 0}
  .cx-form button{margin-top:16px}
  .cx-acct{padding:12px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--rule);font-size:14px;color:var(--ink2);margin-bottom:6px}
  .cx-acct a{font-weight:700;color:var(--amber)}
  .cx-msg{padding:12px 14px;border-radius:10px;background:#ecfdf3;color:#05603a;margin-bottom:14px;font-weight:600}
  .cx-msg.error{background:#fef3f2;color:#b42318}
  .cx-more{margin-top:12px}
  .cx-more summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--amber)}
  .cx-note{font-size:13px;color:var(--ink3);margin-top:10px}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var inr = false;
  try { var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; inr = tz === "Asia/Kolkata" || tz === "Asia/Calcutta"; } catch (e) {}
  window.mtjCurrency = inr ? "INR" : "USD";
  document.querySelectorAll(".js-price").forEach(function (el) { el.textContent = inr ? el.dataset.inr : el.dataset.usd; });
});
</script>
