{# Reveals .js-india-only elements for readers in India (time zone check, no tracking). Courses are priced in rupees. #}
<script>
(function () {
  try {
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    var force = /[?&]india=1\b/.test(location.search);
    if (tz === "Asia/Kolkata" || tz === "Asia/Calcutta" || force) {
      document.querySelectorAll(".js-india-only").forEach(function (el) { el.hidden = false; });
    }
  } catch (e) {}
  document.querySelectorAll(".js-course-click").forEach(function (a) {
    a.addEventListener("click", function () { window.mtjTrack && window.mtjTrack("course_click", { course: a.dataset.course, where: a.dataset.where }); });
  });
})();
</script>
