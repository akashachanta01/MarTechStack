{% extends "account/base.html" %}
{% block title %}Password Updated | MarTechJobs{% endblock %}
{% block auth_content %}
<div style="width:100%;max-width:420px;text-align:center;">
  <div style="width:64px;height:64px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--green);">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1 style="font-family:'Playfair Display',serif;font-size:26px;font-weight:800;color:var(--navy);margin-bottom:10px;">Password updated!</h1>
  <p style="font-size:14px;color:var(--ink3);margin-bottom:24px;">You can now sign in with your new password.</p>
  <a href="{% url 'account_login' %}" class="btn btn-amber">Sign In →</a>
</div>
{% endblock %}
