{% extends "account/base.html" %}
{% block title %}Check Your Email | MarTechJobs{% endblock %}
{% block auth_content %}
<div style="width:100%;max-width:420px;text-align:center;">
  <div style="width:64px;height:64px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--green);">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
  </div>
  <h1 style="font-family:'Playfair Display',serif;font-size:26px;font-weight:800;color:var(--navy);margin-bottom:10px;">Check your inbox</h1>
  <p style="font-size:14px;color:var(--ink3);line-height:1.6;margin-bottom:24px;">We've sent a password reset link. It may take a minute to arrive.</p>
  <a href="{% url 'account_login' %}" class="btn btn-ghost">Back to Sign In</a>
</div>
{% endblock %}
