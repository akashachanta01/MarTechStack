{% extends "account/base.html" %}
{% block title %}Sign Out | MarTechJobs{% endblock %}
{% block auth_content %}
<div style="width:100%;max-width:380px;text-align:center;">
  <h1 style="font-family:'Playfair Display',serif;font-size:26px;font-weight:800;color:var(--navy);margin-bottom:10px;">Sign out?</h1>
  <p style="font-size:14px;color:var(--ink3);margin-bottom:24px;">You'll need to sign back in to access your saved jobs and alerts.</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-amber btn-lg" style="width:100%;">Sign Out</button>
  </form>
  <a href="/" style="display:block;margin-top:14px;font-size:13px;color:var(--ink3);">Cancel</a>
</div>
{% endblock %}
