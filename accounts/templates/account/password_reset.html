{% extends "account/base.html" %}
{% block title %}Reset Password | MarTechJobs{% endblock %}
{% block auth_content %}
<div style="width:100%;max-width:420px;">
  <div style="text-align:center;margin-bottom:28px;">
    <h1 style="font-family:'Playfair Display',serif;font-size:28px;font-weight:800;color:var(--navy);margin-bottom:6px;">Reset your password</h1>
    <p style="font-size:14px;color:var(--ink3);">Enter your email and we'll send a reset link.</p>
  </div>
  <div class="auth-card">
    <form method="post" action="{% url 'account_reset_password' %}">
      {% csrf_token %}
      <div class="auth-field">
        <label class="auth-label">Email address</label>
        <input type="email" name="email" required placeholder="you@company.com" class="auth-input">
      </div>
      <button type="submit" class="btn btn-amber btn-block" style="padding:14px;">Send Reset Link</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--ink3);">
      Remember it? <a href="{% url 'account_login' %}" style="color:var(--amber);font-weight:700;">Sign in →</a>
    </p>
  </div>
</div>
<style>
.auth-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);}
.auth-field{margin-bottom:18px;}
.auth-label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px;}
.auth-input{width:100%;padding:12px 14px;border:1.5px solid var(--rule2);border-radius:8px;font-family:'Hanken Grotesk',sans-serif;font-size:15px;color:var(--ink);background:var(--paper);outline:none;transition:border .15s;}
.auth-input:focus{border-color:var(--amber);}
</style>
{% endblock %}
